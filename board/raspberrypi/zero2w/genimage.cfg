image boot.vfat {
	vfat {
		files = {
			"bcm2710-rpi-zero-2-w.dtb",
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/start.elf",
			"zImage",
			"boot.scr"
		}
	}
	size = 128M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition system_a {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 2500M
	}

	partition system_b {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 2500M
	}

	partition data {
		partition-type = 0x83
		size = 2000M
	}

	partition recovery {
		partition-type = 0x83
		size = 512M
	}
}
