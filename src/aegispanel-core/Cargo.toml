[package]
name = "aegispanel-core"
version = "1.2.3"
edition = "2021"
authors = ["AegisPanel OS Team"]
description = "Core daemon for AegisPanel OS managing state machine, HA WebSocket, GPIO, Power, IPC, and OTA"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
zeroize = "=1.8.1"
thiserror = "=1.0.69"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls", "multipart"] }
ed25519-dalek = { version = "=2.1.1", default-features = false }
sha2 = "=0.10.8"
chrono = { version = "=0.4.38", features = ["serde"] }
idna_adapter = "=1.2.0"
native-tls = "=0.2.11"
openssl = "=0.10.64"
openssl-sys = "=0.9.102"
syn = "=2.0.87"
litemap = "=0.7.3"

# GPIO support for Linux / Raspberry Pi
[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.16"

[dev-dependencies]
tokio-test = "0.4"
