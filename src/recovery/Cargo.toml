[package]
name = "aegispanel-recovery"
version = "1.0.0"
edition = "2021"
authors = ["AegisPanel OS Team"]
description = "Emergency Recovery Subsystem daemon for AegisPanel OS"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json"] }
base64ct = "=1.6.0"
